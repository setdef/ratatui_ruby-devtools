image: archlinux
packages:
  - bash
  - base-devel
  - curl
  - openssl
  - libyaml
  - zlib
  - readline
  - gdbm
  - ncurses
  - libffi
  - git
sources:
  - https://git.sr.ht/~kerrick/ratatui_ruby-devtools
tasks:
  - setup: |
      curl https://mise.jdx.dev/install.sh | sh
      echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.buildenv
      echo 'eval "$($HOME/.local/bin/mise activate bash)"' >> ~/.buildenv
      echo 'export LANG="en_US.UTF-8"' >> ~/.buildenv
      echo 'export LC_ALL="en_US.UTF-8"' >> ~/.buildenv
      . ~/.buildenv
      export CI="true"
      cd ratatui_ruby-devtools
      mise install
      mise x -- pip install reuse
      mise x -- gem install bundler:4.0.3
      mise reshim
      mise x -- bundle config set --local path vendor/bundle
      mise x -- bundle config set --local frozen 'true'
      mise x -- bundle install
  - lint: |
      . ~/.buildenv
      cd ratatui_ruby-devtools
      mise x -- bundle exec rake
